<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parcel</title><meta name="description" content="A 3D delivery simulation about where things are and how they move."><meta name="theme-color" content="#f2f2f2"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f33c4'/%3E%3Cpath d='M9 11h14v11H9z' fill='%23fff'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<div id="scene" aria-label="Three dimensional delivery map"></div><div id="scene-labels" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="./">parcel</a>
  <form id="find" role="search">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
    <input id="find-input" type="search" placeholder="Find a place" aria-label="Find a place, an object, or coordinates" autocomplete="off">
    <div id="find-results" class="menu" hidden></div>
  </form>
  <select id="scene-select" aria-label="Scene"></select>
  <div class="menu-anchor">
    <button id="add-button" class="icon-button solid" aria-label="Add to the map" aria-haspopup="true" aria-expanded="false" aria-controls="add-menu"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
    <div id="add-menu" class="menu" hidden></div>
  </div>
  <div class="menu-anchor">
    <button id="more-button" class="icon-button solid" aria-label="More" aria-haspopup="true" aria-expanded="false" aria-controls="more-menu"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1" class="dot"/><circle cx="8" cy="8" r="1" class="dot"/><circle cx="13" cy="8" r="1" class="dot"/></svg></button>
    <div id="more-menu" class="menu" hidden>
      <button id="activity-button">Activity</button>
      <button id="rules">How it works</button>
      <button id="reset">Reset</button>
    </div>
  </div>
</header>

<aside id="inspector" class="card" aria-label="Selected object" hidden></aside>

<div class="view-controls">
  <button id="zoom-in" class="icon-button" aria-label="Zoom in"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
  <button id="zoom-out" class="icon-button" aria-label="Zoom out"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg></button>
  <button id="view-top" class="icon-button" aria-label="Toggle overhead view"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1"/></svg></button>
  <button id="view-reset" class="icon-button" aria-label="Reset camera"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8a4.5 4.5 0 1 0 1.4-3.3M3.5 2.5v2.5H6"/></svg></button>
</div>

<section class="next" aria-label="Next step">
  <div id="progress" class="progress" role="img" aria-label="Route progress"></div>
  <span id="next-text" role="status"></span>
  <button id="next-action" class="primary"></button>
  <button id="wait" class="icon-button" aria-label="Wait in place" title="Wait in place"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4v8M10 4v8"/></svg></button>
</section>

<div id="toast" role="status" aria-live="polite"></div>
<dialog id="info-dialog"><button id="close-dialog" class="icon-button" aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button><div id="dialog-content"></div></dialog>
<script type="module" src="app.js"></script></body></html>
